#root, #root * { font-family: 'Nunito',ui-sans-serif,system-ui,sans-serif !important; }
</style>
<script>
(function(){
  // Carpeta de respaldo seleccionada por el usuario. File System Access
  // permite escribir directamente en el directorio elegido, sin descargas.
  let backupFolderHandle=null;
  let lastAutoBackup=null;
  const folderDbName='habituo-backup-folder-v1';
  const folderStoreName='handles';

  function openFolderDb(){
    return new Promise((resolve,reject)=>{
      const request=indexedDB.open(folderDbName,1);
      request.onupgradeneeded=()=>request.result.createObjectStore(folderStoreName);
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
  }
  async function loadFolderHandle(){
    try{
      const db=await openFolderDb();
      const handle=await new Promise((resolve,reject)=>{
        const request=db.transaction(folderStoreName,'readonly').objectStore(folderStoreName).get('backupFolder');
        request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error);
      });
      if(handle) backupFolderHandle=handle;
      updateFolderLabel();
    }catch(error){console.warn('No se pudo cargar la carpeta de respaldo',error);}
  }
  async function persistFolderHandle(handle){
    const db=await openFolderDb();
    await new Promise((resolve,reject)=>{
      const request=db.transaction(folderStoreName,'readwrite').objectStore(folderStoreName).put(handle,'backupFolder');
      request.onsuccess=()=>resolve(); request.onerror=()=>reject(request.error);
    });
    backupFolderHandle=handle;
    updateFolderLabel();
  }
  function updateFolderLabel(){
    const label=document.getElementById('backup-folder-status');
    if(label) label.textContent=backupFolderHandle?'Carpeta elegida. Elige carpeta si Chrome lo permite; en Android puedes guardar copias desde el menú de compartir.':'Aún no has elegido una carpeta.';
  }
  async function chooseBackupFolder(){
    // Android Chrome does not expose the directory picker in every install
    // context. Do not imply a folder has been selected when it cannot be.
    if(!window.showDirectoryPicker){
      alert('Chrome en Android no permite elegir una carpeta para que una página escriba allí. Para guardar una copia, usa “Backup ahora” y selecciona Archivos/Descargas en el menú para compartir. Los respaldos automáticos se conservan dentro de Habituo.');
      return;
    }
    try{
      const handle=await window.showDirectoryPicker({id:'habituo-backups',mode:'readwrite'});
      const permission=await handle.requestPermission({mode:'readwrite'});
      if(permission!=='granted') throw new Error('Chrome no concedió permiso de escritura.');
      await persistFolderHandle(handle);
      alert('Carpeta configurada. Los respaldos manuales y automáticos irán allí.');
      checkAutomaticBackups();
    }catch(error){if(error.name!=='AbortError') alert('No se pudo elegir la carpeta: '+error.message);}
  }
  window.habituoChooseBackupFolder=chooseBackupFolder;
  async function writeBackup(serialized,filename){
    if(!backupFolderHandle) throw new Error('Primero elige la carpeta para los respaldos.');
    let permission=await backupFolderHandle.queryPermission({mode:'readwrite'});
    if(permission!=='granted') permission=await backupFolderHandle.requestPermission({mode:'readwrite'});
    if(permission!=='granted') throw new Error('Chrome no concedió permiso para escribir en la carpeta. Vuelve a elegirla.');
    const fileHandle=await backupFolderHandle.getFileHandle(filename,{create:true});
    const writable=await fileHandle.createWritable();
    await writable.write(serialized);
    await writable.close();
  }
  window.habituoSaveBackup=async(serialized,filename,kind)=>{
    try{
      await writeBackup(serialized,filename);
      const message=kind==='manual'?'Backup guardado en la carpeta elegida.':'Backup automático guardado en la carpeta elegida.';
      const toast=[...document.querySelectorAll('button')].find(el=>el.textContent?.trim()==='Backup ahora');
      window.dispatchEvent(new CustomEvent('habituo-backup-saved',{detail:{kind,message,filename}}));
      return true;
    }catch(error){alert(error.message);throw error;}
  };
  async function checkAutomaticBackups(){
    if(!backupFolderHandle) return;
    try{
      const value=localStorage.getItem('habit_backup_auto');
      if(!value||value===lastAutoBackup) return;
      const history=JSON.parse(value);
      const newest=Array.isArray(history)?history[0]:history;
      if(!newest?.data||!newest.timestamp) return;
      await writeBackup(JSON.stringify(newest,null,2),backupFilename(newest.timestamp));
      lastAutoBackup=value;
    }catch(error){console.warn('No se pudo guardar el backup automático',error);}
  }
  function backupFilename(timestamp){
    const date=new Date(timestamp||Date.now());
    const yyyy=date.getFullYear();
    const mm=String(date.getMonth()+1).padStart(2,'0');
    const dd=String(date.getDate()).padStart(2,'0');
    const hh=String(date.getHours()).padStart(2,'0');
    const min=String(date.getMinutes()).padStart(2,'0');
    const ss=String(date.getSeconds()).padStart(2,'0');
    return `habituo-backup-${yyyy}-${mm}-${dd}-${hh}${min}${ss}.json`;
  }
  loadFolderHandle();
  setInterval(checkAutomaticBackups,5000);


})();
</script>

</body>
</html>
